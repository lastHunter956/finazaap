<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="finazaap">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>finazaap</title>
  <link rel="manifest" href="manifest.json">

</head>
<body>
  <script>
    // Detect WebGPU support for Dart validation
    window.webGpuSupported = typeof navigator !== 'undefined' && !!navigator.gpu;

    console.log('🚀 Iniciando secuencia de carga de ML Engines...');

    // 1. Iniciar la descarga de MediaPipe
    const loadMediaPipe = import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@0.10.27').then(m => {
      window.FilesetResolver = m.FilesetResolver;
      window.LlmInference = m.LlmInference;
      console.log('✅ MediaPipe GenAI cargado exitosamente en window');
    });

    // 2. Iniciar la descarga de LiteRT-LM y asignar la promesa a window.litertLmReady (como exige la lib)
    window.litertLmReady = (async () => {
      const m = await import('https://cdn.jsdelivr.net/npm/@litert-lm/core@0.12.1/+esm');
      window.Engine = m.Engine;
      console.log('✅ LiteRT-LM cargado exitosamente en window');
      return m.Engine;
    })();

    // 3. RETRASAR EL ARRANQUE DE FLUTTER HASTA QUE TODO ESTÉ LISTO
    // Esto garantiza 100% que window.LlmInference y window.Engine NO sean null
    Promise.all([loadMediaPipe, window.litertLmReady]).then(() => {
      console.log('⚡ Todos los motores listos. Arrancando Flutter Web...');
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    }).catch(err => {
      console.error('❌ Error crítico descargando dependencias ML:', err);
      // Arrancar Flutter de todos modos para que la UI muestre el error capturado
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
