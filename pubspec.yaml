name: finazaap
description: App de finanzas personales 100% offline con encriptación local y UI premium bancaria
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  
  # Local Storage - Encriptación
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  encrypt: ^5.0.3
  # isar: ^3.1.0+1  # Alternativa a Hive (descomentar si se usa)
  # isar_flutter_libs: ^3.1.0+1
  
  # Persistencia básica
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  crypto: ^3.0.3  # Para PBKDF2 y hashing en EncryptionService
  
  # UI/UX Premium
  intl: ^0.20.2
  image_picker: ^1.0.7
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0
  gradient_borders: ^1.0.1
  flutter_colorpicker: ^1.0.3  # Para selección de colores en cuentas
  
  # PDF y Reportes
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # Utilities
  uuid: ^4.3.3
  collection: ^1.18.0
  syncfusion_flutter_charts: ^32.1.21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  
  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/images/

  # Fonts (descomentar si se usan custom fonts)
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
