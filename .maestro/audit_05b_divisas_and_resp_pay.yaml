appId: com.example.finazaap.validation
---
# Lote 4b: Verificar RespAudit30k con scroll + filtro Servicio en Pagos
# + Probar Divisas ($ COP -> USD -> $ COP) exclusivamente en Ajustes

- stopApp: com.example.finazaap.validation
- launchApp:
    appId: com.example.finazaap.validation
    clearState: false

- extendedWaitUntil:
    visible: "Transacciones"
    timeout: 15000

# 1. Responsabilidades: verificar RespAudit30k, filtro Servicio y totales
- tapOn: "Pagos"
- extendedWaitUntil:
    visible: "Responsabilidades"
    timeout: 8000
- assertVisible: "\\$ 30\\.000,00"
- assertVisible: "Proy\\. Anual: \\$ 360\\.000"

- tapOn: ".*Servicio.*"
- extendedWaitUntil:
    visible: ".*RespAudit30k.*"
    timeout: 8000
- assertNotVisible: ".*banco occidente.*"
- takeScreenshot: audit_05b_resp_servicio_filter
- tapOn: ".*Todos.*"

# 2. Divisas en Ajustes (SOLO Divisa por defecto)
# Nota de accesibilidad: toda la fila fusiona semántica; el dropdown '$ COP' está a la derecha (80%,20%)
- tapOn: "Ajustes"
- extendedWaitUntil:
    visible: ".*Divisa por defecto.*"
    timeout: 8000
- tapOn:
    point: "80%,20%"
- extendedWaitUntil:
    visible: ".*USD.*"
    timeout: 5000
- takeScreenshot: audit_05b_divisas_dropdown
- tapOn: ".*USD.*"

- tapOn: "Inicio"
- extendedWaitUntil:
    visible: "Transacciones"
    timeout: 8000
- takeScreenshot: audit_05b_home_usd

# Restaurar COP inmediatamente
- tapOn: "Ajustes"
- extendedWaitUntil:
    visible: ".*Divisa por defecto.*"
    timeout: 8000
- tapOn:
    point: "80%,20%"
- extendedWaitUntil:
    visible: ".*COP.*"
    timeout: 5000
- tapOn: ".*COP.*"

- tapOn: "Inicio"
- extendedWaitUntil:
    visible: "Transacciones"
    timeout: 8000
- assertVisible: "\\$ 405\\.000,00"
- takeScreenshot: audit_05b_home_cop_restored
