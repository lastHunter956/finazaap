appId: com.example.finazaap.validation
---
# Lote 4: Crear y verificar Obligación sintética RespAudit30k en Pagos
# + Probar Divisas ($ COP -> USD -> $ COP) exclusivamente en Ajustes

- stopApp: com.example.finazaap.validation
- launchApp:
    appId: com.example.finazaap.validation
    clearState: false

- extendedWaitUntil:
    visible: "Transacciones"
    timeout: 15000

# 1. Responsabilidades: crear RespAudit30k por 30000
- tapOn: "Pagos"
- extendedWaitUntil:
    visible: "Responsabilidades"
    timeout: 8000

- tapOn:
    point: "87%,83%"
- extendedWaitUntil:
    visible: ".*Nueva Obligación.*"
    timeout: 5000
- tapOn: ".*Nueva Obligación.*"
- extendedWaitUntil:
    visible: "Ej: Alquiler, Netflix..."
    timeout: 5000

- tapOn: "Ej: Alquiler, Netflix..."
- inputText: "RespAudit30k"
- hideKeyboard

- tapOn: "0.00"
- inputText: "30000"
- hideKeyboard

- tapOn: "Crear Obligación"
- extendedWaitUntil:
    visible: ".*RespAudit30k.*"
    timeout: 8000
- assertVisible: "\\$ 30\\.000,00"
- takeScreenshot: audit_05_resp_created

# 2. Divisas en Ajustes (SOLO Divisa por defecto)
- tapOn: "Ajustes"
- extendedWaitUntil:
    visible: "Divisa por defecto"
    timeout: 8000
- tapOn: "\\$ COP"
- extendedWaitUntil:
    visible: ".*USD.*"
    timeout: 5000
- takeScreenshot: audit_05_divisas_dropdown
- tapOn: ".*USD.*"

- tapOn: "Inicio"
- extendedWaitUntil:
    visible: "Transacciones"
    timeout: 8000
- takeScreenshot: audit_05_home_usd

# Restaurar COP inmediatamente
- tapOn: "Ajustes"
- extendedWaitUntil:
    visible: "Divisa por defecto"
    timeout: 8000
- tapOn: ".*USD.*"
- extendedWaitUntil:
    visible: ".*COP.*"
    timeout: 5000
- tapOn: ".*COP.*"

- tapOn: "Inicio"
- extendedWaitUntil:
    visible: "Transacciones"
    timeout: 8000
- assertVisible: "\\$ 405\\.000,00"
- takeScreenshot: audit_05_home_cop_restored
